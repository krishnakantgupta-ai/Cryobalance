[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryobalance"
version = "0.1.0"
description = "Regularized spherical harmonic orientation balancing for single-particle cryo-EM"
authors = [{ name = "Krishna Kant Gupta", email = "krishnakant.gupta@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.3.0",
    "starfile>=0.5.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
cryobalance = "cryobalance.cli:main"
